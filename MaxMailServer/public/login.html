<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MaxMail — Private mail server accessible only from authorized devices.">
    <title>MaxMail — Device Access Only</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.4;
                box-shadow: 0 0 20px rgba(88, 166, 255, 0.05);
            }

            50% {
                opacity: 0.9;
                box-shadow: 0 0 30px rgba(88, 166, 255, 0.15);
            }
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05070a;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(88, 166, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(188, 140, 255, 0.03) 0%, transparent 50%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #c9d1d9;
            overflow: hidden;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 520px;
            position: relative;
            z-index: 1;
            animation: fade-in 0.8s ease-out;
        }

        .logo {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #58a6ff 0%, #bc8cff 50%, #f778ba 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            margin-bottom: 0.4rem;
            line-height: 1.1;
        }

        .version {
            font-size: 0.7rem;
            color: #3d444d;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 2.5rem;
            font-weight: 500;
        }

        .message {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #7d8590;
            margin-bottom: 2.5rem;
        }

        .message strong {
            color: #9da5b0;
            font-weight: 600;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 1.6rem;
            border: 1px solid #1a1f29;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 500;
            color: #58a6ff;
            background: rgba(56, 139, 253, 0.04);
            animation: pulse-glow 4s ease-in-out infinite;
            letter-spacing: 0.5px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3fb950;
            flex-shrink: 0;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #21262d, transparent);
            margin: 2.2rem auto;
        }

        .footer {
            font-size: 0.7rem;
            color: #21262d;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="container">
        <h1 id="logo" class="logo">MaxMail</h1>
        <p class="version">Private Mail Server</p>
        <p class="message">
            This server is accessible only from<br>
            <strong>authorized MaxMail devices</strong>.
        </p>
        <div id="status-badge" class="badge">
            <span class="badge-dot"></span>
            Device Access Only
        </div>
        <div class="divider"></div>
        <p class="footer">MAXMAIL SERVER v0.2</p>
    </div>
</body>

</html>
